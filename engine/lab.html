<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Semantic Motion Engine Lab</title>
<style>
:root{font-family:ui-sans-serif,system-ui,sans-serif;color:#171915;background:#eee9dd}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{touch-action:none}
#viewport{position:fixed;inset:0;overflow:hidden;background:#eee9dd}
#world{position:absolute;left:0;top:0;width:2400px;height:1600px;will-change:transform}
svg{display:block;width:2400px;height:1600px}
.hud{position:fixed;z-index:5;left:14px;top:14px;background:rgba(238,233,221,.92);border:1px solid #171915;padding:10px 12px;font-size:12px;line-height:1.4;pointer-events:none}
.controls{position:fixed;z-index:6;right:14px;top:14px;display:flex;gap:6px}.controls button{border:1px solid #171915;background:#eee9dd;padding:8px 10px;cursor:pointer}.controls button.active{background:#171915;color:#eee9dd}
.legend{position:fixed;z-index:5;left:14px;bottom:14px;font-size:11px;max-width:310px;color:#55584f;pointer-events:none}
</style>
</head>
<body>
<div id="viewport">
  <div id="world">
    <svg viewBox="0 0 2400 1600" aria-label="Content-neutral semantic motion engine lab">
      <rect width="2400" height="1600" fill="#eee9dd"/>
      <g id="geo-grid" opacity=".5">
        <path d="M0 300H2400M0 600H2400M0 900H2400M0 1200H2400M400 0V1600M800 0V1600M1200 0V1600M1600 0V1600M2000 0V1600" stroke="#bdb5a6" stroke-width="2"/>
        <path d="M180 1180 C500 850 720 1050 1010 720 S1510 480 1830 720 S2150 990 2280 560" fill="none" stroke="#8b8b7d" stroke-width="18" opacity=".35"/>
      </g>

      <g id="structure-network" fill="none" stroke="#315f56" stroke-width="8">
        <circle cx="880" cy="700" r="120"/>
        <circle cx="1520" cy="760" r="150"/>
        <path id="travel-path" d="M1000 700 C1160 500 1320 970 1370 790"/>
      </g>

      <g id="traveler-wrap"><circle id="traveler" cx="0" cy="0" r="22" fill="#b58a35"/></g>
      <g id="velocity-pulse" transform="translate(1200 760)"><circle cx="0" cy="0" r="180" fill="none" stroke="#9a4c42" stroke-width="10" opacity=".8"/></g>

      <g id="detail-layer">
        <text x="820" y="520" font-size="38" font-family="Georgia,serif">A</text>
        <text x="1490" y="520" font-size="38" font-family="Georgia,serif">B</text>
        <path d="M820 860 l120 80 l-80 110 l-100-90z" fill="#d7d0c1" stroke="#171915" stroke-width="4"/>
        <path d="M1520 980 l160 60 l-55 120 l-150-55z" fill="#d7d0c1" stroke="#171915" stroke-width="4"/>
      </g>
    </svg>
  </div>
</div>
<div class="hud"><b>Semantic Motion Engine Lab</b><br><span id="readout">—</span></div>
<div class="controls"><button id="free" class="active">Free roam</button><button id="timeline">Timeline</button></div>
<div class="legend">Free roam: drag/pan, pinch or ctrl-wheel zoom. Timeline: wheel/drag scrubs a camera path and graphic choreography. Pinch/ctrl-wheel remains a separate semantic-zoom layer on top of the guided camera.</div>
<script type="module">
import { SemanticMotionRuntime } from './runtime.js';

const worldSpec = {
  world: { width:2400, height:1600, minScale:.3, maxScale:5, initialCamera:{x:1200,y:800,scale:.55} },
  objects: {
    'demo.geography': { selector:'#geo-grid', lod:{min:.3,max:1.05,fade:.35} },
    'demo.structure': { selector:'#structure-network', lod:{min:.65,max:2.4,fade:.45} },
    'demo.path': { selector:'#travel-path', lod:{min:.65,max:3.2,fade:.3} },
    'demo.traveler': { selector:'#traveler-wrap', lod:{min:.7,max:4,fade:.3} },
    'demo.velocityPulse': { selector:'#velocity-pulse', lod:{min:.55,max:4,fade:.3} },
    'demo.detail': { selector:'#detail-layer', lod:{min:1.45,max:5,fade:.5} }
  }
};

const motionSpec = {
  timelines: {
    story: {
      source:'timeline.primary',
      tracks:[
        {target:'@camera',channel:'x',keyframes:[{at:0,value:620},{at:.45,value:1200,easing:'smoothstep'},{at:1,value:1740}]},
        {target:'@camera',channel:'y',keyframes:[{at:0,value:520},{at:.5,value:800},{at:1,value:1050}]},
        {target:'@camera',channel:'scale',keyframes:[{at:0,value:.7},{at:.55,value:1.2},{at:1,value:2.1,easing:'easeInOutCubic'}]},
        {target:'demo.path',channel:'draw',keyframes:[{at:0,value:0},{at:.75,value:1}]},
        {target:'demo.traveler',channel:'pathPosition',path:'demo.path',keyframes:[{at:.1,value:0},{at:.9,value:1}]},
        {target:'demo.detail',channel:'opacity',keyframes:[{at:.55,value:.15},{at:1,value:1}]}
      ]
    },
    velocity: {
      source:'input.activity',
      tracks:[
        {target:'demo.velocityPulse',channel:'opacity',keyframes:[{at:0,value:.08},{at:1,value:.9}]},
        {target:'demo.velocityPulse',channel:'scale',keyframes:[{at:0,value:.82},{at:1,value:1.2}],easing:'smoothstep'}
      ]
    }
  }
};

const viewport=document.querySelector('#viewport');
const runtime=new SemanticMotionRuntime({viewport,worldElement:document.querySelector('#world'),sceneRoot:document,worldSpec,motionSpec});
const readout=document.querySelector('#readout');
const free=document.querySelector('#free');
const timeline=document.querySelector('#timeline');
function setMode(mode){runtime.setMode(mode);free.classList.toggle('active',mode==='free');timeline.classList.toggle('active',mode==='timeline')}
free.onclick=()=>setMode('free');timeline.onclick=()=>setMode('timeline');
function hud(){const c=runtime.camera.snapshot();readout.textContent=`mode ${runtime.mode} · zoom ${c.scale.toFixed(2)}× · user zoom ${runtime.signals.get('camera.userZoom').toFixed(2)}× · progress ${runtime.signals.get('timeline.primary').toFixed(3)} · activity ${runtime.signals.get('input.activity').toFixed(2)}`;requestAnimationFrame(hud)}hud();
window.runtime=runtime;
</script>
</body>
</html>

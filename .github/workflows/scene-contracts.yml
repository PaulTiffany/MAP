name: Living scene contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scene-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check simulation, rendering and controller contracts
        run: |
          node lib/sticker-world/selftest.mjs
          node sprite-selftest.mjs
          node selftest.mjs

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<meta name="description" content="Mutually Assured Progress as a semantic-zoom conceptual world.">
<title>MAP — semantic zoom atlas</title>
<style>
:root{--paper:#f3efe4;--ink:#171915;--muted:#6d6d64;--rule:#c8c1b2;--map:#24604b;--mad:#97493f;--gold:#b18a34;--blue:#527687;--soft:#ddd6c8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
body{font-family:Georgia,'Times New Roman',serif;touch-action:none}
button,input{font:inherit}
#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;background:radial-gradient(circle at 50% 50%,#f8f5ed 0,var(--paper) 58%,#ebe5d9 100%)}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:5000px;height:5000px;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-select:none}
svg{display:block;width:5000px;height:5000px;overflow:visible}
.semantic{will-change:opacity}
.cart-label{font-family:ui-sans-serif,system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;font-weight:700}
.serif{font-family:Georgia,'Times New Roman',serif}
.region-hit{cursor:pointer;fill:transparent}
.region-title{cursor:pointer}
.world-link{font-family:ui-sans-serif,system-ui,sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:underline;cursor:pointer}
.embedded{font-family:ui-sans-serif,system-ui,sans-serif;background:rgba(243,239,228,.92);border:1px solid #171915;padding:18px;width:100%;height:100%;color:#171915;user-select:text;-webkit-user-select:text}
.embedded h3{font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:500;margin:0 0 8px}
.embedded p{font-size:13px;line-height:1.45;margin:0 0 12px;color:#55584f}
.embedded label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.embedded input{width:100%;accent-color:var(--map)}
.embedded svg{width:100%;height:130px;margin-top:8px}
#chrome{position:fixed;inset:0;z-index:20;pointer-events:none;font-family:ui-sans-serif,system-ui,sans-serif}
#brand{position:absolute;left:18px;top:16px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
#readout{position:absolute;right:18px;top:14px;text-align:right;font-size:11px;color:var(--muted);line-height:1.45}
#readout b{color:var(--ink);font-weight:700}
#controls{position:absolute;right:16px;bottom:16px;display:flex;gap:7px;pointer-events:auto}
#controls button{width:42px;height:42px;border:1px solid var(--ink);background:rgba(243,239,228,.9);color:var(--ink);cursor:pointer;font-family:ui-sans-serif,system-ui,sans-serif;font-size:18px}
#controls button:hover,#controls button:focus{background:var(--ink);color:var(--paper)}
#depth{position:absolute;left:18px;bottom:18px;width:150px}
#depth .track{height:1px;background:var(--rule);position:relative;margin:7px 0}
#depth .track i{position:absolute;left:0;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--ink);transform:translateX(0)}
#depth .labels{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
#hint{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);font-size:10px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
#crumb{position:absolute;left:50%;top:15px;transform:translateX(-50%);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media(max-width:700px){#brand{font-size:9px;max-width:160px}#readout{font-size:9px}#hint{display:none}#depth{width:110px}.embedded{padding:12px}.embedded h3{font-size:21px}}
@media(prefers-reduced-motion:reduce){#world{will-change:auto}}
</style>
</head>

<script>
(() => {
  const viewport=document.getElementById('viewport');
  const world=document.getElementById('world');
  const overview=document.getElementById('overview');
  const structure=document.getElementById('structure');
  const mechanism=document.getElementById('mechanism');
  const formal=document.getElementById('formal');
  const scaleReadout=document.getElementById('scaleReadout');
  const depthName=document.getElementById('depthName');
  const depthDot=document.getElementById('depthDot');
  const crumb=document.getElementById('crumb');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const W=5000,H=5000,CX=2500,CY=2500;
  const targets={map:[CX,CY],origin:[900,2520],theory:[2500,820],applications:[4110,2490],intuition:[2510,4180]};

  const pointers=new Map();
  let pinch=null;

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
  const minScale=()=>Math.max(.10,Math.min(.28,Math.min(innerWidth/3300,innerHeight/3300)));
  const maxScale=3.4;

  function centerAt(wx,wy,s=scale){scale=clamp(s,minScale(),maxScale);tx=innerWidth/2-wx*scale;ty=innerHeight/2-wy*scale;bound();render();}
  function bound(){const pad=120;const sw=W*scale,sh=H*scale;if(sw<=innerWidth){tx=(innerWidth-sw)/2}else{tx=clamp(tx,innerWidth-sw-pad,pad)}if(sh<=innerHeight){ty=(innerHeight-sh)/2}else{ty=clamp(ty,innerHeight-sh-pad,pad)}}
  function worldAtScreen(x,y){return{x:(x-tx)/scale,y:(y-ty)/scale}}
  function zoomAt(x,y,factor){const before=worldAtScreen(x,y);const old=scale;scale=clamp(scale*factor,minScale(),maxScale);tx=x-before.x*scale;ty=y-before.y*scale;bound();motion=(motion+Math.abs(Math.log(scale/old))*1.6)%1;render()}
  function panBy(dx,dy){tx+=dx;ty+=dy;bound();motion=(motion+Math.hypot(dx,dy)*.0015)%1;render()}
  function fade(group,value){group.style.opacity=value.toFixed(3);group.style.pointerEvents=value>.45?'auto':'none'}
  function depthState(){if(scale<.58)return['Overview','overview'];if(scale<1.15)return['Structure','structure'];if(scale<1.95)return['Mechanism','mechanism'];return['Formal','formal']}
  function nearestRegion(){const c=worldAtScreen(innerWidth/2,innerHeight/2);let best=['map',1e9];for(const [name,[x,y]] of Object.entries(targets)){const d=Math.hypot(c.x-x,c.y-y);if(d<best[1])best=[name,d]}return best[0]}
  function setParticle(pathId,circleId,phase){const path=document.getElementById(pathId),dot=document.getElementById(circleId);if(!path||!dot)return;try{const len=path.getTotalLength(),p=path.getPointAtLength(len*phase);dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y)}catch(_){}}

  function render(){world.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${scale})`;
    const o0=1-smooth(.42,.76,scale);
    const o1=smooth(.35,.72,scale)*(1-.25*smooth(2.1,3.2,scale));
    const o2=smooth(.82,1.55,scale);
    const o3=smooth(1.65,2.45,scale);
    fade(overview,o0);fade(structure,o1);fade(mechanism,o2);fade(formal,o3);
    const [name]=depthState();depthName.textContent=name;scaleReadout.textContent=scale.toFixed(2)+'×';
    const dp=clamp((Math.log(scale)-Math.log(minScale()))/(Math.log(maxScale)-Math.log(minScale())),0,1);depthDot.style.transform=`translateX(${dp*145}px)`;
    const region=nearestRegion();crumb.textContent=`MAP / ${region} / ${name.toLowerCase()}`;

    const mech=smooth(.75,1.55,scale);
    document.getElementById('madThreatAB').style.opacity=(1-mech).toFixed(3);
    document.getElementById('madThreatBA').style.opacity=(1-mech).toFixed(3);
    document.getElementById('mapBridgeOrigin').style.opacity=mech.toFixed(3);
    document.getElementById('viabilityA').setAttribute('r',205+mech*58);
    document.getElementById('viabilityB').setAttribute('r',205+mech*58);
    setParticle('theoryTransferPath','theoryParticle',motion);
    setParticle('intuitionTransferPath','intuitionParticle',(motion+.5)%1);

    const formalP=smooth(1.7,2.8,scale);const lean=document.getElementById('leanCurve');lean.style.strokeDashoffset=String(1-formalP);updateLeanDot(formalP);
  }

  function animateTo(wx,wy,s){cancelAnimationFrame(anim);if(reduce){centerAt(wx,wy,s);return}const s0=scale,x0=tx,y0=ty;const targetS=clamp(s,minScale(),maxScale);const targetX=innerWidth/2-wx*targetS,targetY=innerHeight/2-wy*targetS;const start=performance.now();const dur=650;function frame(now){const t=clamp((now-start)/dur,0,1),e=1-Math.pow(1-t,4);scale=s0+(targetS-s0)*e;tx=x0+(targetX-x0)*e;ty=y0+(targetY-y0)*e;bound();motion=(motion+.007)%1;render();if(t<1)anim=requestAnimationFrame(frame)}anim=requestAnimationFrame(frame)}

  viewport.addEventListener('wheel',e=>{e.preventDefault();const mouseLike=e.deltaMode===1||(Math.abs(e.deltaY)>48&&Math.abs(e.deltaX)<4);if(e.ctrlKey||e.metaKey||mouseLike){zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015))}else{panBy(-e.deltaX,-e.deltaY)}},{passive:false});

  viewport.addEventListener('dblclick',e=>{if(e.target.closest('a,input,button,.embedded'))return;zoomAt(e.clientX,e.clientY,1.65)});

  viewport.addEventListener('pointerdown',e=>{if(e.target.closest('a,input,button,.embedded'))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});viewport.setPointerCapture(e.pointerId);if(pointers.size===1){drag={id:e.pointerId,x:e.clientX,y:e.clientY};viewport.classList.add('dragging')}else if(pointers.size===2){const pts=[...pointers.values()];pinch={d:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),mx:(pts[0].x+pts[1].x)/2,my:(pts[0].y+pts[1].y)/2};drag=null}});
  viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&drag&&drag.id===e.pointerId){panBy(e.clientX-prev.x,e.clientY-prev.y);drag.x=e.clientX;drag.y=e.clientY}else if(pointers.size===2){const pts=[...pointers.values()],d=Math.max(1,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)),mx=(pts[0].x+pts[1].x)/2,my=(pts[0].y+pts[1].y)/2;if(pinch){panBy(mx-pinch.mx,my-pinch.my);zoomAt(mx,my,d/pinch.d)}pinch={d,mx,my}}});
  function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(pointers.size===0){drag=null;viewport.classList.remove('dragging')}else if(pointers.size===1){const [id,p]=[...pointers.entries()][0];drag={id,x:p.x,y:p.y}}}
  viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);

  document.querySelectorAll('[data-focus]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();const n=el.dataset.focus,[x,y]=targets[n];animateTo(x,y,Math.max(.78,scale*1.35))}));
  document.getElementById('plus').addEventListener('click',()=>zoomAt(innerWidth/2,innerHeight/2,1.35));
  document.getElementById('minus').addEventListener('click',()=>zoomAt(innerWidth/2,innerHeight/2,1/1.35));
  document.getElementById('reset').addEventListener('click',()=>animateTo(CX,CY,minScale()));
  addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.key==='+'||e.key==='=')zoomAt(innerWidth/2,innerHeight/2,1.25);if(e.key==='-')zoomAt(innerWidth/2,innerHeight/2,.8);if(e.key==='0'||e.key==='Escape')animateTo(CX,CY,minScale());if(e.key==='ArrowLeft')panBy(90,0);if(e.key==='ArrowRight')panBy(-90,0);if(e.key==='ArrowUp')panBy(0,90);if(e.key==='ArrowDown')panBy(0,-90)});

  const qRange=document.getElementById('qRange'),qOut=document.getElementById('qOut'),leanCurve=document.getElementById('leanCurve'),leanDot=document.getElementById('leanDot');
  function plotLean(){const q=+qRange.value/100,p0=.18; qOut.textContent=q.toFixed(2);let d='';for(let n=0;n<=35;n++){const v=1-Math.pow(q,n)*(1-p0),x=10+n*(700/35),y=112-v*98;d+=(n?'L':'M')+x+' '+y+' '}leanCurve.setAttribute('d',d);render()}
  function updateLeanDot(p){try{const len=leanCurve.getTotalLength(),pt=leanCurve.getPointAtLength(len*p);leanDot.setAttribute('cx',pt.x);leanDot.setAttribute('cy',pt.y);leanDot.style.opacity=p>.02?'1':'0'}catch(_){}}
  qRange.addEventListener('input',plotLean);

  addEventListener('resize',()=>{const c=worldAtScreen(innerWidth/2,innerHeight/2);tx=innerWidth/2-c.x*scale;ty=innerHeight/2-c.y*scale;bound();render()});
  scale=minScale();centerAt(CX,CY,scale);plotLean();
})();
</script>
</body>
</html>
